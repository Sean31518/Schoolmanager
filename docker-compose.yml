services:
  schulmanager:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: schulmanager:latest
    ports:
      - "6969:6969"
    volumes:
      - schulmanager-data:/data
    env_file:
      - .env
    environment:
      - PORT=6969
      - NODE_ENV=production
      - DATABASE_URL=file:/data/schulmanager.db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:6969/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  schulmanager-data:
