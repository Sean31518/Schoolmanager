services:
  schulmanager:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: schulmanager:latest
    ports:
      - "${PORT:-6969}:${PORT:-6969}"
    volumes:
      - schulmanager-data:/data
    env_file:
      - .env
    environment:
      - PORT=${PORT:-6969}
      - NODE_ENV=production
      - DATABASE_URL=file:/data/schulmanager.db
      - UPLOADS_DIR=/data/uploads
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:${PORT:-6969}/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  schulmanager-data:
